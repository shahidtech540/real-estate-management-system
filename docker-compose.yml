services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: rems-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: rems_user
      POSTGRES_PASSWORD: rems_password
      POSTGRES_DB: rems_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rems_user -d rems_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: rems-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: rems-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  app:
    image: rems-app:local
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rems-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      SQLITE_DB_PATH: /app/data/rems.sqlite
      NOTIFICATION_PROVIDER_MODE: ${NOTIFICATION_PROVIDER_MODE:-mock}
      PORT: 3000
      DATABASE_URL: postgresql://rems_user:rems_password@postgres:5432/rems_db?schema=public
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadminpassword
      JWT_ACCESS_SECRET: rems-prod-jwt-access-secret-2026
      JWT_REFRESH_SECRET: rems-prod-jwt-refresh-secret-2026
    volumes:
      - sqlite_data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  maintenance-worker:
    image: rems-app:local
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["npm", "run", "maintenance:worker"]
    environment:
      NODE_ENV: production
      SQLITE_DB_PATH: /app/data/rems.sqlite
      NOTIFICATION_PROVIDER_MODE: ${NOTIFICATION_PROVIDER_MODE:-mock}
    volumes:
      - sqlite_data:/app/data
    depends_on:
      app:
        condition: service_healthy

  reports-worker:
    image: rems-app:local
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["npm", "run", "reports:worker"]
    environment:
      NODE_ENV: production
      SQLITE_DB_PATH: /app/data/rems.sqlite
    volumes:
      - sqlite_data:/app/data
    depends_on:
      app:
        condition: service_healthy

  agents-worker:
    image: rems-app:local
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["npm", "run", "agents:worker"]
    environment:
      NODE_ENV: production
      SQLITE_DB_PATH: /app/data/rems.sqlite
      AGENT_PROVIDER_MODE: local
    volumes:
      - sqlite_data:/app/data
    depends_on:
      app:
        condition: service_healthy

volumes:
  sqlite_data:
  postgres_data:
  redis_data:
  minio_data:
