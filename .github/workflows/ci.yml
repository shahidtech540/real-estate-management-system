name: REMS CI Pipeline

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  verify:
    name: Typecheck, Unit & Integration Tests, Coverage & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Validate PostgreSQL design and Compose shared-volume configuration
        run: npm run validate:design

      - name: Run unit & integration tests with coverage threshold (>= 70%)
        run: npm run test:coverage

      - name: Production build check
        run: npm run build

      - name: Install Chromium for browser workflow verification
        run: npx playwright install --with-deps chromium

      - name: Browser test (isolated SQLite database)
        run: npm run test:e2e
